<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Klangschalen</title>
<style>
:root{--bg:#1e1b2e;--card:#2a2640;--fg:#f1ecff;--mute:#a79fc7;--acc:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px 110px;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:420px}
h1{font-weight:500;font-size:1.3rem;text-align:center;margin:20px 0 14px}
h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;color:var(--fg)}
.chip{background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer;flex:1 1 40%}
.chip.sel{border-color:var(--acc)}
.chip small{display:block;color:var(--mute);font-size:.75rem}
.time{font-size:4.2rem;font-weight:200;text-align:center;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.pill{flex:0 0 auto;padding:10px 16px;flex:1 1 auto;text-align:center}
input[type=number]{background:var(--card);border:2px solid transparent;border-radius:14px;padding:10px;width:90px;text-align:center}
.ctl{display:flex;gap:10px;margin-top:14px}
.ctl button{flex:1;padding:16px;border:0;border-radius:14px;font-size:1.05rem;cursor:pointer;background:var(--card)}
#go{background:var(--acc);color:#1e1b2e;font-weight:600;flex:2}
#plus{flex:1.2}
label{display:flex;align-items:center;gap:8px;color:var(--mute)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;color:var(--fg);width:100%}
.opt .l{flex:1;min-width:0}
.opt small{display:block;color:var(--mute);font-size:.75rem;margin-top:2px}
.opt .r{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--mute)}
.opt input[type=number]{width:64px;padding:8px;background:var(--bg);border-radius:10px}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.stack{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<main>
<h1>🔔 Klangschalen</h1>

<div id="phase" style="text-align:center;color:var(--acc);font-size:.9rem;height:1.2em"></div>
<div class="time" id="clock" style="margin-top:4px">10:00</div>
<div class="ctl">
  <button id="cancel">Abbrechen</button>
  <button id="plus">+1 min</button>
  <button id="go">Start</button>
</div>
<div id="err" style="color:#f08a8a;font-size:.8rem;text-align:center;margin-top:10px"></div>

<h2>Klangschale</h2>
<div class="row" id="bowls"></div>

<h2>Dauer</h2>
<div class="row" id="presets"></div>
<div class="stack" style="margin-top:8px">
  <div class="opt"><span class="l">Eigene Dauer</span>
    <span class="r"><input type="number" id="min" min="1" max="180" value="10" inputmode="numeric"> Min</span></div>
</div>

<h2>Optionen</h2>
<div class="stack">
  <label class="opt"><span class="l">Gong zum Start</span>
    <span class="r"><input type="checkbox" id="startGong" checked></span></label>
  <div class="opt"><span class="l">Intervallgong<small>alle x Minuten, 0 = aus</small></span>
    <span class="r"><input type="number" id="interval" min="0" max="60" value="0" inputmode="numeric"> Min</span></div>
  <div class="opt"><span class="l">Startverzögerung<small>Countdown vor dem Start, 0 = sofort</small></span>
    <span class="r"><input type="number" id="delay" min="0" max="300" value="0" inputmode="numeric"> Sek</span></div>
</div>
</main>

<script>
// ---- Klangschalen: echte mp3s (file) + synthetische. Neue mp3 -> Zeile mit file:"name.mp3" ergänzen ----
const BOWLS=[
 {name:"Tibetisch",note:"echt, Es-Ton",file:"tibetisch.mp3"},
 {name:"Klassisch",note:"echt, lang",file:"klassisch.mp3"},
 {name:"Ombu",note:"echt, sehr lang",file:"ombu.mp3"},
 {name:"Synth tief",note:"warm, lang",   f:130.8, decay:9},
 {name:"Synth mittel",note:"weich",    f:196.0, decay:8},
 {name:"Synth hell",note:"klar",         f:293.7, decay:7},
 {name:"Synth zart",note:"hoch",         f:440.0, decay:6},
 {name:"Kristall",note:"sehr hoch",   f:587.3, decay:5},
];
const PARTIALS=[[1,1],[2.71,.5],[5.15,.25],[8.3,.12]]; // typische Schalen-Obertöne
const $=id=>document.getElementById(id);
let ctx, bufCache={};
function msg(t){ const m=$("err"); if(m) m.textContent=t; }
function audio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state!=="running") ctx.resume(); return ctx; }

async function ring(b){
  const c=audio();
  if(b.file){
    try{
      if(!bufCache[b.file]){
        const r=await fetch(b.file); if(!r.ok) throw new Error("HTTP "+r.status);
        const ab=await r.arrayBuffer();
        bufCache[b.file]=await new Promise((ok,no)=>c.decodeAudioData(ab,ok,no));
      }
      const s=c.createBufferSource(); s.buffer=bufCache[b.file]; s.connect(c.destination); s.start(); msg("");
    }catch(e){
      delete bufCache[b.file];
      try{ await new Audio(b.file).play(); msg(""); }
      catch(e2){ msg("Fehler bei "+b.file+": "+e.message+" / "+e2.message); }
    }
    return;
  }
  const t=c.currentTime, out=c.createGain();
  out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(.5,t+.01);
  out.gain.exponentialRampToValueAtTime(.0005,t+b.decay); out.connect(c.destination);
  PARTIALS.forEach(([r,a],i)=>{
    [0,1.2].forEach(beat=>{ // zwei leicht verstimmte Oszillatoren = Schweben
      const o=c.createOscillator(), g=c.createGain();
      o.frequency.value=b.f*r+beat; g.gain.value=a/2;
      g.gain.setValueAtTime(a/2,t); g.gain.exponentialRampToValueAtTime(.0001,t+b.decay/(1+i*.6));
      o.connect(g).connect(out); o.start(t); o.stop(t+b.decay+.2);
    });
  });
}

// ---- UI ----
let bowl=0; try{ bowl=+localStorage.getItem("bowl")||0; }catch(e){}
function renderBowls(){
  $("bowls").innerHTML="";
  BOWLS.forEach((b,i)=>{
    const d=document.createElement("button"); d.className="chip"+(i===bowl?" sel":"");
    d.innerHTML=b.name+"<small>"+b.note+"</small>";
    d.onclick=()=>{bowl=i;try{localStorage.setItem("bowl",i);}catch(e){}renderBowls();ring(b);};
    $("bowls").appendChild(d);
  });
}
[1,5,10,15,20,30,45].forEach(m=>{
  const d=document.createElement("button"); d.className="chip pill"; d.textContent=m+" min";
  d.onclick=()=>{$("min").value=m;idle();}; $("presets").appendChild(d);
});
renderBowls();

// ---- Timer ----
let state="idle", endAt=0, remain=0, tick=null, nextIv=0, wl=null, delayEnd=0;
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function idle(){ if(state==="idle") $("clock").textContent=fmt((+$("min").value||1)*60000); }
$("min").oninput=idle; idle();

// Verzögerung merken
try{ const d=localStorage.getItem("delay"); if(d!==null) $("delay").value=d; }catch(e){}
$("delay").oninput=()=>{ try{ localStorage.setItem("delay",$("delay").value||"0"); }catch(e){} };

async function lock(){ try{ wl=await navigator.wakeLock.request("screen"); }catch(e){} }
function unlock(){ try{ wl&&wl.release(); }catch(e){} wl=null; }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&(state==="running"||state==="delay")) lock(); });

function reset(){ clearInterval(tick); state="idle"; $("go").textContent="Start"; $("phase").textContent=""; unlock(); idle(); }

// Phase 1: Countdown vor dem Start
function startDelay(sec){
  state="delay"; delayEnd=Date.now()+sec*1000; $("go").textContent="Jetzt starten"; $("phase").textContent="Start in …"; lock();
  clearInterval(tick);
  tick=setInterval(()=>{
    const left=delayEnd-Date.now(); $("clock").textContent=fmt(left);
    if(left<=0) beginTimer();
  },250);
  $("clock").textContent=fmt(sec*1000);
}
// Phase 2: eigentlicher Timer
function beginTimer(){
  clearInterval(tick); $("phase").textContent="";
  if($("startGong").checked) ring(BOWLS[bowl]);
  remain=(+$("min").value||1)*60000; run(remain);
}
function run(ms){
  endAt=Date.now()+ms; state="running"; $("go").textContent="Pause"; $("phase").textContent=""; lock();
  const iv=(+$("interval").value||0)*60000;
  nextIv=iv?Date.now()+iv:0;
  clearInterval(tick);
  tick=setInterval(()=>{
    const left=endAt-Date.now(); $("clock").textContent=fmt(left);
    if(left<=0) return finish();
    if(nextIv&&Date.now()>=nextIv&&left>iv/2){ ring(BOWLS[bowl]); nextIv+=iv; }
  },250);
}
function finish(){ reset(); ring(BOWLS[bowl]); setTimeout(()=>ring(BOWLS[bowl]),4000); }

$("go").onclick=()=>{
  audio();
  if(state==="idle"){
    const d=Math.max(0,Math.floor(+$("delay").value||0));
    if(d>0) startDelay(d); else beginTimer();
  }
  else if(state==="delay"){ beginTimer(); }
  else if(state==="running"){ remain=endAt-Date.now(); clearInterval(tick); state="paused"; $("go").textContent="Weiter"; unlock(); }
  else { run(remain); }
};
$("cancel").onclick=reset;

// +1 Minute: vor/während Verzögerung die Dauer erhöhen, sonst Restzeit verlängern
$("plus").onclick=()=>{
  if(state==="running"){ endAt+=60000; $("clock").textContent=fmt(endAt-Date.now()); }
  else if(state==="paused"){ remain+=60000; $("clock").textContent=fmt(remain); }
  else { $("min").value=Math.min(180,(+$("min").value||0)+1); if(state==="idle") idle(); }
};

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
